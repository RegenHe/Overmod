<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="robots" content="noindex,nofollow">
  <title>Overmod 管理</title>
  <link rel="stylesheet" href="/assets/styles.css">
</head>
<body class="admin-page">
  <header class="topbar">
    <div class="topbar-inner">
      <a class="brand" href="/">
        <strong>OVERMOD</strong><small>CATALOGUE ADMIN</small>
      </a>
      <a class="back-link" href="/">返回公开页面</a>
    </div>
  </header>

  <main class="content admin-content">
    <div class="page-heading compact-heading">
      <div><p class="breadcrumb">OVERMOD / ADMIN</p><h1>目录管理</h1></div>
      <button id="admin-logout" class="subtle-button" type="button" hidden>退出</button>
    </div>

    <section id="admin-login" class="admin-panel login-panel">
      <h2>管理员验证</h2>
      <p>输入服务器配置的管理员令牌。</p>
      <form id="login-form" class="login-form">
        <label><span>管理员令牌</span><input id="admin-token" type="password" autocomplete="current-password" required></label>
        <button class="primary-button" type="submit">进入管理</button>
      </form>
      <p id="login-status" class="form-status" aria-live="polite"></p>
    </section>

    <div id="admin-workspace" hidden>
      <form id="mod-form" class="admin-panel editor">
        <div class="panel-heading">
          <h2 id="editor-heading">添加模组</h2>
          <button id="edit-cancel" class="text-button" type="button" hidden>取消编辑</button>
        </div>
        <input id="mod-id" type="hidden">
        <input id="submission-id" type="hidden">
        <div class="form-grid">
          <label><span>模组名称 *</span><input id="field-name" maxlength="96" placeholder="地图建议填写：合集名称 / 关卡名称" required>
            <small>地图建议使用“合集名称 / 关卡名称”，工具直接填写模组名称。</small>
          </label>
          <label><span>作者</span><input id="field-author" maxlength="64"></label>
          <label><span>版本号</span><input id="field-version" maxlength="32" placeholder="例如 1.0.0"></label>
          <label><span>模组类型</span><select id="field-mod-type"><option value="tool">工具</option><option value="map">地图</option></select></label>
          <label class="map-identity"><span>关卡合集 UID</span><input id="field-level-set-uid" maxlength="160" placeholder="OC2DIY 合集 uid">
            <small>与 sceneName 同时填写时，服务器会生成和 Overrank 相同的关卡键。</small>
          </label>
          <label class="map-identity"><span>sceneName</span><input id="field-scene-name" maxlength="160" placeholder="关卡内部 sceneName"></label>
          <label class="wide map-identity"><span>完整关卡键</span><input id="field-level-key" maxlength="96" placeholder="oc2diy-...">
            <small>也可以直接粘贴已有的完整键。填写 UID 和 sceneName 后，本字段应留空或与生成结果一致；不要填写 6 位标识。</small>
          </label>
          <label class="wide"><span>简单介绍 *</span><textarea id="field-description" maxlength="1600" rows="4" required></textarea></label>
          <label><span>下载按钮文字</span><input id="field-download-label" maxlength="48" value="项目页面"></label>
          <label><span>下载或项目地址 *</span><input id="field-download-url" type="url" maxlength="500" placeholder="http:// 或 https://" required></label>
          <label class="wide"><span>下载方式或安装提示</span><textarea id="field-download-instructions" maxlength="800" rows="3"></textarea></label>
          <label class="check"><input id="field-enabled" type="checkbox" checked><span>在公开目录中显示</span></label>
          <label class="check"><input id="field-featured" type="checkbox"><span>显示在推荐模组栏</span></label>
        </div>
        <div class="form-actions">
          <button class="primary-button" type="submit">保存</button>
          <span id="editor-status" class="form-status" aria-live="polite"></span>
        </div>
      </form>

      <div class="admin-list-heading"><h2>待审核投稿</h2><span id="submission-count"></span></div>
      <div id="submission-list" class="admin-list"></div>

      <div class="admin-list-heading"><h2>已有项目</h2><span id="admin-count"></span></div>
      <div id="admin-list" class="admin-list"></div>
      <nav id="admin-pagination" class="pagination" aria-label="已有项目分页" hidden></nav>
    </div>
  </main>
  <script src="/assets/admin.js" defer></script>
</body>
</html>
